# Frontend-only Render service (Web Service — NOT Static Site)
# Manual settings if not using root render.yaml:
#   Root Directory: frontend
#   Build Command:  npm install --include=dev && npm run build
#   Start Command:  npm start

services:
  - type: web
    name: mistry-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: HOST
        value: 0.0.0.0
      - key: NITRO_PRESET
        value: node-server
      - key: VITE_API_URL
        value: https://mistry-men.onrender.com
