# Render Blueprint — deploy backend + frontend as separate web services
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API (Express + MongoDB) ──────────────────────────────────────
  - type: web
    name: mistry-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: FRONTEND_URL
        value: https://mistry-men-1.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: LOVABLE_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false

  # ── Frontend (TanStack Start + Nitro node-server) ────────────────────────
  - type: web
    name: mistry-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: HOST
        value: 0.0.0.0
      - key: NITRO_PRESET
        value: node-server
      - key: VITE_API_URL
        value: https://mistry-men.onrender.com
